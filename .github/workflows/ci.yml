name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            popup/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: joplin-server-clipper
          path: |
            manifest.json
            icons/
            content_scripts/
            util/*.mjs
            !util/*.test.mjs
            popup/build/
            LICENSE
            LICENSES/
            NOTICE.md
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error